<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Outfit:wght@700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    :root {
      --md-sys-color-background: #fafdfd;
      --md-sys-color-primary: #006a6a;
      --md-sys-color-primary-container: #6ff5f5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --md-sys-color-background: #191c1c;
        --md-sys-color-primary: #4edada;
        --md-sys-color-primary-container: #004f4f;
      }
    }
    body {
      margin: 0;
      background-color: var(--md-sys-color-background);
      font-family: 'Inter', sans-serif;
    }
    .hidden { display: none !important; }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      height: 100vh;
      text-align: center;
      color: var(--md-sys-color-primary);
    }
    .loader {
      width: 48px;
      height: 48px;
      border: 5px solid var(--md-sys-color-primary-container);
      border-bottom-color: var(--md-sys-color-primary);
      border-radius: 50%;
      animation: rotation 1s linear infinite;
    }
    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    header, main { opacity: 0; transition: opacity 0.3s ease; }
    .loaded header, .loaded main { opacity: 1; }
  </style>
</head>

<body>
  <div id="app">
    <header>
      <h1>Spot Practice Mate</h1>
    </header>

    <main>
      <div id="splash-loader" class="splash-container fade-in">
        <div class="loader"></div>
        <p>Restoring your session...</p>
      </div>

      <div id="upload-section" class="upload-card hidden fade-in">
        <span class="material-symbols-outlined icon">cloud_upload</span>
        <h2>Upload MusicXML</h2>
        <p>Drag and drop your .musicxml or .mxl file here</p>
        <input type="file" id="file-input" class="hidden" accept=".musicxml,.xml,.mxl" />
      </div>

      <div id="viewer-section" class="hidden fade-in">
        <div id="score-nav-wrapper" class="score-navigation-wrapper">
          <button id="exit-fullscreen-btn" class="floating-exit-btn" title="Exit Fullscreen">
            <span class="material-symbols-outlined">close_fullscreen</span>
          </button>
          <button id="prev-page-btn" class="nav-side-btn hidden" title="Previous Page (Left Arrow)">
            <span class="material-symbols-outlined">chevron_left</span>
          </button>

          <div id="viewer-canvas">
            <div id="music-container" class="music-container"></div>
            <div id="music-container-full" class="music-container music-container-full hidden"></div>
            <div id="loader" class="loader hidden"></div>
          </div>

          <button id="next-page-btn" class="nav-side-btn hidden" title="Next Page (Right Arrow)">
            <span class="material-symbols-outlined">chevron_right</span>
          </button>
        </div>

        <div class="status-bar" id="status-bar">
          No file loaded
        </div>

        <div class="controls-container">
          <div class="setting-group">
            <label for="passage-length">Passage Length:</label>
            <select id="passage-length">
              <option value="2" selected>2 Bars</option>
              <option value="3">3 Bars</option>
              <option value="4">4 Bars</option>
              <option value="8">8 Bars</option>
              <option value="16">16 Bars</option>
            </select>
          </div>
          
          <div id="passage-controls" class="mode-controls">
            <button id="new-passage-btn" class="filled">
              <span class="material-symbols-outlined">shuffle</span>
              New Passage
            </button>
          </div>

          <div id="full-score-controls" class="mode-controls hidden">
            <span id="page-indicator">1 / 10</span>
            <button id="fullscreen-btn" class="tonal" title="Toggle Fullscreen">
              <span class="material-symbols-outlined">fullscreen</span>
            </button>
          </div>

          <div class="divider"></div>

          <button id="toggle-full-score-btn" class="outlined">
            <span class="material-symbols-outlined">menu_book</span>
            View Full Score
          </button>
          <button id="upload-new-btn" class="outlined">
            <span class="material-symbols-outlined">file_upload</span>
          </button>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
