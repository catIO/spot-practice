<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Outfit:wght@700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    :root {
      --md-sys-color-background: #fafdfd;
      --md-sys-color-primary: #006a6a;
      --md-sys-color-primary-container: #6ff5f5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --md-sys-color-background: #191c1c;
        --md-sys-color-primary: #4edada;
        --md-sys-color-primary-container: #004f4f;
      }
    }

    body {
      margin: 0;
      background-color: var(--md-sys-color-background);
      font-family: 'Inter', sans-serif;
    }

    .hidden {
      display: none !important;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      height: 100vh;
      text-align: center;
      color: var(--md-sys-color-primary);
    }

    .loader {
      width: 48px;
      height: 48px;
      border: 5px solid var(--md-sys-color-primary-container);
      border-bottom-color: var(--md-sys-color-primary);
      border-radius: 50%;
      animation: rotation 1s linear infinite;
    }

    @keyframes rotation {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    header,
    main {
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .loaded header,
    .loaded main {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div id="app">
    <header>
      <h1>Spot Practice Mate</h1>
    </header>

    <main>
      <div id="splash-loader" class="splash-container fade-in">
        <div class="loader"></div>
        <p>Restoring your session...</p>
      </div>

      <div id="upload-section" class="upload-card hidden fade-in">
        <span class="material-symbols-outlined icon">cloud_upload</span>
        <h2>Upload MusicXML</h2>
        <p>Drag and drop your .musicxml or .mxl file here</p>
        <input type="file" id="file-input" class="hidden" accept=".musicxml,.xml,.mxl" />
      </div>

      <div id="viewer-section" class="hidden fade-in" style="display: flex; flex-direction: column; width: 100%; height: 100%;">
        
        <!-- Top Pill Toolbar -->
        <div id="top-toolbar" class="top-toolbar">
          <!-- Mode Switcher -->
          <div class="toolbar-section">
            <button id="toggle-mode-btn" class="toolbar-text-btn" title="Toggle Mode">
               <span class="material-symbols-outlined" id="mode-icon">menu_book</span>
               <span id="mode-label">Full Score</span>
            </button>
          </div>
          
          <div class="toolbar-divider"></div>

          <!-- Navigation Area: Spot Mode -->
          <div class="toolbar-section" id="nav-section-spot">
            <label class="m3-select-chip" title="Passage length in bars">
              <span class="m3-chip-label">Bars</span>
              <select id="passage-length" class="m3-chip-select">
                <option value="2" selected>2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="8">8</option>
                <option value="12">12</option>
              </select>
            </label>
            <label class="m3-select-chip" title="Select start measure / spot">
              <span class="m3-chip-label">Spot</span>
              <select id="start-measure" class="m3-chip-select">
                <option value="random">Random</option>
              </select>
            </label>
            <span id="spot-progress" class="toolbar-text spot-progress-badge" title="Current spot progress in cycle">1 / 1</span>
            <button id="new-passage-btn" class="toolbar-text-btn">
               <span class="material-symbols-outlined">shuffle</span> New Spot
            </button>
          </div>
          <div id="cycle-toast" class="cycle-toast hidden">
            <span class="material-symbols-outlined" style="font-size: 18px;">autorenew</span>
            <span id="cycle-toast-text">Cycle complete! Reshuffled.</span>
          </div>

          <!-- Navigation Area: Full Score Mode -->
          <div class="toolbar-section hidden" id="nav-section-full">
            <div class="m3-select-chip" title="Current page">
              <span class="m3-chip-label">Page</span>
              <input type="number" id="page-input" class="m3-chip-input" value="1" min="1" />
              <span class="m3-chip-label" style="margin-left: 2px;">/ <span id="total-pages-display">1</span></span>
            </div>
          </div>

          <div class="toolbar-divider"></div>

          <!-- Zoom Controls -->
          <div class="toolbar-section">
            <button id="zoom-out-btn" class="icon-btn"><span class="material-symbols-outlined">remove</span></button>
            <span id="zoom-display" class="toolbar-text zoom-text">100%</span>
            <button id="zoom-in-btn" class="icon-btn"><span class="material-symbols-outlined">add</span></button>
          </div>

          <div class="toolbar-divider"></div>

          <!-- Fullscreen & Upload -->
          <div class="toolbar-section">
            <button id="fullscreen-toolbar-btn" class="icon-btn" title="Toggle Fullscreen">
              <span class="material-symbols-outlined" id="fs-icon">fullscreen</span>
            </button>
            <button id="upload-new-btn" class="icon-btn" title="Upload New Score">
              <span class="material-symbols-outlined">file_upload</span>
            </button>
            <button id="toggle-measures-btn" class="icon-btn" title="Toggle Measure Numbers">
              <span class="material-symbols-outlined" id="measures-icon">tag</span>
            </button>
          </div>
        </div>

        <div id="score-nav-wrapper" class="score-navigation-wrapper">
          <button id="prev-page-btn" class="nav-side-btn hidden" title="Previous Page">
            <span class="material-symbols-outlined">chevron_left</span>
          </button>
          <div id="viewer-canvas">
            <div id="music-container" class="music-container"></div>
            <div id="music-container-full" class="music-container music-container-full hidden"></div>
            <div id="loader" class="loader hidden"></div>
          </div>
          <button id="next-page-btn" class="nav-side-btn hidden" title="Next Page">
            <span class="material-symbols-outlined">chevron_right</span>
          </button>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
